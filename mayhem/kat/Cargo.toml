# Additive KAT (known-answer test) probe for the Mayhem integration oracle.
# A small, DYNAMICALLY-LINKED binary that drives the SAME near-primitives borsh
# transaction decoder the fuzz target exercises, on a FIXED constructed input, and
# prints computed field values that mayhem/test.sh greps for exact matches.
#
# Because it is dynamically linked and lives under /mayhem, the verify-repo sabotage
# shim (LD_PRELOAD constructor that _exit(0)s non-system executables) neuters it —
# so a neutered build prints nothing and test.sh's grep FAILS. That makes the oracle
# behavioral (SPEC §6.3), unlike a statically-immune `cargo test` alone.
#
# Standalone [workspace] keeps it out of nearcore's root workspace resolution.
[package]
name = "nearcore-mayhem-kat"
version = "0.0.0"
publish = false
edition = "2021"

[dependencies]
borsh = "1"

[dependencies.near-primitives]
path = "../../core/primitives"
default-features = false

[dependencies.near-crypto]
path = "../../core/crypto"
default-features = false

[[bin]]
name = "kat"
path = "src/main.rs"

[workspace]
members = ["."]
